<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Validador de Fotos</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="app-container">
            <header class="barra-superior">
                <div class="logo-area">
                    <span class="logo-icone">🛡️</span>
                    <span class="logo-txt">Validador de Fotos</span>
                </div>
            </header>
            <aside class="barra-lateral">
                <nav class="menu">
                    <a href="#" class="menu-link ativo">
                        <span class="menu-icone">📸</span>
                        <span class="menu-texto">Validar Selfie</span>
                    </a>
                    <a href="#" class="menu-link">
                        <span class="menu-icone">🪪</span>
                        <span class="menu-texto">Validador de documentos</span>
                    </a>
                </nav>
            </aside>
            <main class="conteudo-principal">
                <section class="cabecalho-conteudo">
                    <h1>Validador de Selfie</h1>
                    <p>Faça o upload ou capture uma foto para valida-la.</p>
                </section>
                <section class="painel-trabalho">
                    <div class="container-selfie">
                       <div class="visualizador-selfie">
                        <video id="webcam" autoplay playsinline></video>
                         <canvas id="foto-capturada"></canvas>
                         <img id="preview-imagem" alt="Pré-visualização da imagem">
                    </div>
                    <div class="controles-selfie">
                        <div class="grupo-cam">
                            <button id="btn-iniciar-cam">Abrir Câmera</button>
                            <button id="btn-tirar-foto" disabled>Tirar foto</button>
                        </div>
                       <div class="grupo-upload">
                        <span class="upload-label">Ou selecione uma foto:</span>
                        <label for="input-arquivo" class="caixa-upload-custom">
                            <span class="upload-custom-icone">📁</span>
                            <span class="upload-custom-texto">Clique para buscar foto</span>
                            <!-- O input feio fica escondido aqui dentro -->
                            <input type="file" id="input-arquivo" accept="image/*">
                        </label>
                    </div>
                        <button id="btn-validar" disabled>Validar foto</button>
                    </div>
                    </div>
                </section>
            </main>


        </div>

    </body>
    </html>
